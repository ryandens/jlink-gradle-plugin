name: "Publish release"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify release tag matches project version
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            printf 'Release tag %s must match version=%s in gradle.properties\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true

      - name: Execute Gradle build
        run: ./gradlew clean build --no-build-cache --no-configuration-cache --no-scan

      - name: Publish release to Gradle Plugin Portal
        run: ./gradlew publishPlugins --no-build-cache --no-configuration-cache --no-scan
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
